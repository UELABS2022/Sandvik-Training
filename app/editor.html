<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Editor — Sandvik Training</title><link rel="stylesheet" href="styles.css"><script src="supabase-config.js"></script><script src="settings.js"></script><script src="cache.js"></script><script src="quiz-adapter.js"></script><script src="sync-queue.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script></head><body><header class="topbar"><a href="index.html">Sandvik Training</a></header><main class="panel"><h1>Question editor</h1><p>Editor/admin role required. Autosave-on-blur sends edits to Supabase; cache refresh makes Mining AI see the change on next sync.</p><label>Question text<textarea id="question" rows="6" placeholder="Select a question after sync"></textarea></label><label>Answer<textarea id="answer" rows="6"></textarea></label><pre id="status"></pre></main><script>const client=SandvikSupabaseClient.createTrainingClient();async function render(){const bank=await client.getQuizBank().catch(()=>client.cache.getQuizBank());const q=bank?.sections?.[0]?.quizSets?.[0]?.questions?.[0];if(q){question.value=q.question;answer.value=q.answer;status.textContent=`Loaded ${q.id}; edits require editor/admin RLS.`}else status.textContent='No cached question.';}render();</script></body></html>
