<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Player — Sandvik Training</title><link rel="stylesheet" href="styles.css"><script src="supabase-config.js"></script><script src="settings.js"></script><script src="cache.js"></script><script src="quiz-adapter.js"></script><script src="sync-queue.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script></head><body><header class="topbar"><a href="index.html">Sandvik Training</a><nav><a href="trainer.html">Trainer</a><a href="editor.html">Editor</a></nav></header><main class="panel"><h1>Player</h1><div id="summary">Loading cached quiz bank…</div><section id="quiz"></section><button id="refresh">Refresh cache</button></main><script>const client=SandvikSupabaseClient.createTrainingClient();let quizBank=null;function renderQuestion(first){const quiz=document.getElementById('quiz');quiz.textContent='';if(!first){const p=document.createElement('p');p.textContent='No questions cached yet.';quiz.appendChild(p);return;}const article=document.createElement('article');article.className='card';const h2=document.createElement('h2');h2.textContent=first.question||'';const p=document.createElement('p');const strong=document.createElement('strong');strong.textContent='Answer: ';p.appendChild(strong);p.appendChild(document.createTextNode(first.answer||'Unanswered'));const btn=document.createElement('button');btn.id='attempt';btn.textContent='Mark correct';article.append(h2,p,btn);quiz.appendChild(article);}async function render(){const el=document.getElementById('summary');try{quizBank=await client.getQuizBank();el.textContent=`${quizBank.stats.totalQuestions} questions / ${quizBank.stats.totalQuizSets} quiz sets cached`;const first=quizBank.sections?.[0]?.quizSets?.[0]?.questions?.[0];renderQuestion(first);const btn=document.getElementById('attempt');if(btn)btn.onclick=async()=>{await client.queue.recordAttempt({question_id:first.id,was_correct:true,time_taken_seconds:5,app_source:'training_app'});el.textContent+=' — attempt saved/queued';};}catch(err){el.textContent=`Offline and no cache yet: ${err.message}`;}}document.getElementById('refresh').onclick=render;render();</script></body></html>
