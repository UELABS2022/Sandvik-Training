<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Sign in — Sandvik Training</title><link rel="stylesheet" href="styles.css"><script src="supabase-config.js"></script><script src="settings.js"></script><script src="cache.js"></script><script src="quiz-adapter.js"></script><script src="sync-queue.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script></head><body><main class="panel"><h1>Sign in to Sandvik Training</h1><p>Enter your email and we’ll send a magic link. The app remains usable offline after cache sync.</p><form id="signin-form"><input id="email" type="email" placeholder="name@example.com" required><button>Send magic link</button></form><pre id="message"></pre><p><a href="index.html">Back</a></p></main><script>const client=SandvikSupabaseClient.createTrainingClient();document.getElementById('signin-form').addEventListener('submit',async(e)=>{e.preventDefault();const email=document.getElementById('email').value;const result=await client.signInWithOtp(email);document.getElementById('message').textContent=result.error?`Error: ${result.error.message}`:'Magic link sent. Check your email.';});if(window.sandvikTraining){window.sandvikTraining.onAuthCallback(async(url)=>{document.getElementById('message').textContent='Auth callback received. Session will refresh in the app.';});}</script></body></html>
